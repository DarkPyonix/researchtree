name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so VitePress can show "last updated" dates.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build viewer
        run: npm run build:web
        env:
          # Public OAuth App client ID; without it the viewer offers PAT sign-in only.
          # GitHub rejects new variable names starting with GITHUB_, so RESEARCHTREE_CLIENT_ID is the usable name.
          VITE_GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID || vars.RESEARCHTREE_CLIENT_ID }}

      - name: Build guide
        run: npm run docs:build

      - name: Assemble site
        run: |
          mkdir -p _site/guide
          cp -r apps/ui/dist/. _site/
          cp -r docs/guide/.vitepress/dist/. _site/guide/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

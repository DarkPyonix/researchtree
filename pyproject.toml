[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[project]
name = "researchtree"
version = "1.1.0"
description = "Visualize your research as a growing tree of experiments, built on Git branches and pull requests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DarkPyonix" }]
keywords = ["experiment-tracking", "git", "pull-requests", "visualization", "research", "ml"]
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Version Control :: Git",
]


[project.optional-dependencies]
keyring = ["keyring>=24"]

[project.urls]
Homepage = "https://github.com/DarkPyonix/researchtree"
Documentation = "https://darkpyonix.github.io/researchtree/guide/"
Repository = "https://github.com/DarkPyonix/researchtree"
Issues = "https://github.com/DarkPyonix/researchtree/issues"

[project.scripts]
researchtree = "researchtree.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["apps/researchtree"]
artifacts = ["apps/researchtree/server/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build.py"

[tool.hatch.build.targets.sdist]
include = ["apps/researchtree", "tests/researchtree", "tests/fixtures", "build.py", "/LICENSE"]
exclude = ["apps/extension"]
artifacts = ["apps/researchtree/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests/researchtree"]
addopts = "--import-mode=importlib"
